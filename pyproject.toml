[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosmos-cloud-mcp"
version = "0.3.1"
description = "MCP server for Cosmos Cloud (azukaar/Cosmos-Server): manage containers, routes, backups and jobs from an MCP client."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]
keywords = ["mcp", "cosmos-cloud", "cosmos-server", "self-hosted", "docker", "homelab"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
cosmos-cloud-mcp = "cosmos_cloud_mcp.server:main"

[project.urls]
Homepage = "https://github.com/alike03/CosmosCloudMCP"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos_cloud_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
